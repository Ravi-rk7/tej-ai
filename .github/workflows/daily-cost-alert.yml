name: Daily provider cost alert

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-provider-cost-alert
  cancel-in-progress: false

jobs:
  report:
    if: ${{ vars.COST_ALERTS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Send aggregate usage report
        env:
          SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          AILAB_DAILY_CALL_LIMIT: ${{ vars.AILAB_DAILY_CALL_LIMIT }}
          OPENAI_DAILY_CALL_LIMIT: ${{ vars.OPENAI_DAILY_CALL_LIMIT }}
          PROVIDER_USAGE_RETENTION_DAYS: ${{ vars.PROVIDER_USAGE_RETENTION_DAYS || '90' }}
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          COST_ALERTS_REQUIRE_DELIVERY: "true"
        run: npm run report:provider-usage
